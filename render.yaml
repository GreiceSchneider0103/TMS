services:
  - type: web
    name: tms-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm ci
    startCommand: npm run dev
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: TINY_BASE_URL
        sync: false
      - key: TINY_API_TOKEN
        sync: false
      - key: INTERNAL_CONTEXT_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_HEADERS
        value: content-type,x-api-key,x-correlation-id,x-request-id,x-idempotency-key
      - key: RATE_LIMIT_AUTH_MAX
        value: 5
      - key: RATE_LIMIT_AUTH_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_WEBHOOK_MAX
        value: 60
      - key: RATE_LIMIT_WEBHOOK_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_API_MAX
        value: 120
      - key: RATE_LIMIT_API_WINDOW_MS
        value: 60000
      - key: REQUEST_BODY_LIMIT_BYTES
        value: 1048576
      - key: SESSION_COOKIE_NAME
        value: tms_api_session

  # tms-worker-tiny-sync, tms-worker-tracking, tms-worker-tracking-total-express
  # and tms-worker-tracking-rte are NOT deployed here. Render's free plan does
  # not support background workers at all (only web services, Postgres and
  # static sites), and the Starter compute plan needed for a worker costs
  # ~$7/month per service. Those 4 workers instead run locally as Windows
  # Scheduled Tasks (see workers/src/*Once.js), polling on a timer and
  # exiting instead of running as long-lived processes. This file can be
  # extended with them again later if this project moves to a paid Render
  # plan.

  - type: web
    name: tms-web
    runtime: node
    rootDir: apps/web
    plan: free
    # NODE_ENV=production below makes `npm ci` omit devDependencies
    # (typescript, eslint, eslint-config-next, @types/*) by default, which
    # breaks `next build`'s module/path-alias resolution (the "Module not
    # found: Can't resolve '@/...'" failures). --include=dev forces npm to
    # install them anyway during the build step; NODE_ENV=production still
    # applies normally at runtime for npm run start.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: tms_api_session
      - key: SESSION_MAX_AGE_SECONDS
        value: 28800
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_DOMAIN
        sync: false
